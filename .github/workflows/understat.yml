name: Penales Understat

# Desactivado: Understat bloquea las conexiones desde los servidores de GitHub (prueba del 3-nov-2026:
# DNS resuelve, pero la conexión se corta en todos los puertos; FPL sí responde). Solo manual.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar penales (2025-26 para la prueba y temporada actual)
        run: python -m fpl.understat 2025 2026
      - name: Guardar
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add data/understat/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Penales Understat $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
