name: Penales Understat

on:
  schedule:
    - cron: "7 9 * * *"     # 04:07 en Lima, antes de la corrida principal
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["fpl/understat.py", ".github/workflows/understat.yml"]

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  descargar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Descargar penales (2025-26 para la prueba y temporada actual)
        run: python -m fpl.understat 2025 2026
      - name: Guardar
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add data/understat/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Penales Understat $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
