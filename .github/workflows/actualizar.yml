name: Actualizar FPL

on:
  schedule:
    - cron: "17 10 * * *"   # 05:17 en Lima
    - cron: "17 22 * * *"   # 17:17 en Lima
  workflow_dispatch:         # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]
    paths: ["config.toml", "fpl/**", "requirements.txt", ".github/workflows/actualizar.yml"]

permissions:
  contents: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Calcular proyecciones
        run: python -m fpl.main
      - name: Guardar resultados
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Resultados $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
