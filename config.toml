# Configuración del modelo FPL. Edita y haz commit: la siguiente corrida usa los valores nuevos.

[equipo]
team_id = 2436428
# 0 = estimar desde tu historial. Pon un número si la estimación no coincide con la web de FPL.
transferencias_libres = 0

[horizonte]
jornadas = 5            # cuántas jornadas futuras se proyectan
descuento = 0.88        # peso de cada jornada siguiente (0.88 = la 2ª vale 88% de la 1ª)

[forma]
vida_media_jugador = 6  # jornadas: un partido de hace 6 GW pesa la mitad que el último
vida_media_equipo = 10  # igual, para la fuerza de ataque/defensa de los equipos
k_ataque = 180          # minutos de "ancla" hacia el promedio de la posición (xG, xA)
k_bonus = 270
k_atajadas = 270
ventana_forma = 4       # jornadas usadas para detectar jugadores en forma
tope_xg_partido = 1.0   # lo máximo que un solo partido aporta de xG a la tasa (evita que un partido defina al jugador)
tope_xa_partido = 0.6   # igual, para xA
# Si un solo partido concentra más del 40% del xG+xA reciente de un jugador, ese partido se acerca a mitad de
# camino de su promedio en los demás. Medido en 2025-26: esos jugadores rendían el 79% de lo proyectado
# (ahora 93%), sin cambiar al resto; mejora el orden en 7 de 9 ventanas (0.312 -> 0.317).
suavizar_mejor_partido = 0.5
concentracion_maxima = 0.4

[calibracion]
# Ajustes medidos con 2025-26 (30 jornadas): acercan cada componente a cómo puntúa FPL.
# No cambian el orden de los jugadores, pero corrigen el nivel de puntos (sesgo de +0.04 a −0.05 por
# partido; los defensas pasan de +0.19 a +0.06).
descontar_tarjetas = true        # resta tarjetas, autogoles y penales fallados esperados de cada jugador
porteros_90 = true               # un portero titular juega los 90
# Las asistencias de FPL superan al xA de Opta (rebotes, penales provocados): 1.37 en promedio
factor_asistencias = { DEF = 1.28, MID = 1.32, FWD = 1.7, GKP = 1.0 }
# Normalizar el xG/xA pasado por la dificultad de cada rival. Probado en 2025-26: no mejora el orden
# (0.278 con y sin ajuste), porque con varias jornadas los rivales se compensan. Desactivado.
ajuste_rival = false

[decision]
permitir_golpes = false            # false = solo transferencias libres (nunca -4)
umbral_transferencia_libre = 1.5   # ganancia mínima para gastar una libre; también lo que vale guardarla
margen_golpe = 1.5                 # además de los 4 puntos del golpe (solo si permitir_golpes = true)
# Protección de rank: cuánto castigar que tu equipo se separe del campo (riesgo = desviación típica
# de tus puntos menos los del campo). 0 = solo puntos esperados. 0.25 = 1 punto de riesgo vale 0.25 pts.
aversion_riesgo = 0.25
# Valor del dinero que queda en el banco tras un cambio. Entre titulares, cada £1m extra compra ~0.9 pts
# esperados en 5 jornadas; como el dinero solo rinde cuando lo gastas en otro cambio, se cuenta la mitad.
valor_dinero = 0.45                # puntos por cada £1m liberado (y lo mismo en contra si lo gastas)
capitania_campo = 0.6              # parte de los dueños del capitán más elegido que lo capitanea
candidatos_por_posicion = 15       # para evaluar dobles transferencias

[ajustes]
# Tu información manda sobre el modelo. Nombres como aparecen en FPL (sin importar tildes ni mayúsculas),
# con el equipo si hay ambigüedad ("Gabriel ARS"), o el id numérico. Deja vacío lo que no uses.
#
# Minutos esperados por partido (0-90), cuando sabes algo de rotación que los datos no ven.
#   minutos = { "Cherki" = 75, "Isak" = 60 }
minutos = {}
no_vender = []      # nunca se proponen como salida
no_comprar = []     # nunca se proponen como entrada
comprar = []        # el plan de 2 semanas debe traerlos (verás cuánto cuesta frente al plan libre)
vender = []         # el plan de 2 semanas debe sacarlos

[chips]
# Medido en 2025-26: en jornadas normales la proyección NO distingue qué jornada es mejor para un chip,
# así que el momento lo deciden jornadas dobles o en blanco, el Bench Boost tras el Wildcard y las bajas.
# Valor real ≈ proyectado × realismo (Bench Boost 0.80; Wildcard ~0.5, con mucha incertidumbre).
realismo = { bboost = 0.80, 3xc = 0.92, freehit = 1.0, wildcard = 0.5 }
wildcard = 10.0      # puntos REALISTAS por encima de tu plan de transferencias libres para recomendarlo
free_hit_bajas = 3   # titulares sin jugar la próxima jornada que justifican el Free Hit

[puntuacion]
# Reglas de FPL. Ajusta si cambian.
gol = { GKP = 10, DEF = 6, MID = 5, FWD = 4 }
porteria_cero = { GKP = 4, DEF = 4, MID = 1, FWD = 0 }
asistencia = 3
contribucion_defensiva = 2
atajadas_por_punto = 3
goles_en_contra_por_punto = 2
